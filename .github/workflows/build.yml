name: Build NikType

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests (Engines)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run engine unit tests
        run: ./gradlew --no-daemon :keyboard-engine:test :prediction-engine:test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            keyboard-engine/build/reports/tests/
            prediction-engine/build/reports/tests/
          if-no-files-found: ignore

  build:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NikType-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: NikType-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: NikType-debug-apk
          path: apk

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: NikType-release-unsigned-apk
          path: apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apk/app-debug.apk
            apk/app-release-unsigned.apk
          generate_release_notes: true
